{{- if .Values.bucketWebIngress.enabled }}
{{- $ing := .Values.bucketWebIngress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-bucketweb
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: bucketweb-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    {{- with $ing.sourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $ing.ingressClassName | quote }}
  tls:
    - hosts:
        - {{ required "bucketWebIngress.host must be set" $ing.host | quote }}
      {{- with $ing.tlsSecretName }}
      secretName: {{ . | quote }}
      {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thanos-bucketweb
                port:
                  number: 10902
{{- end }}
