{{- if .Values.uiIngress.enabled }}
{{- $ing := .Values.uiIngress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: ui-ingress
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ printf "%s-ui-auth" .Release.Name | quote }}
    nginx.ingress.kubernetes.io/auth-realm: thanos UI
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    {{- with $ing.sourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $ing.ingressClassName | quote }}
  tls:
    - hosts:
        - {{ required "uiIngress.host must be set" $ing.host | quote }}
      {{- with $ing.tlsSecretName }}
      secretName: {{ . | quote }}
      {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thanos-query
                port:
                  number: 10902
{{- end }}
