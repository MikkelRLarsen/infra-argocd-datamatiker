# Local development credentials, intentionally tracked in Git.
# bootstrap/install.sh overrides the hostname for the current minikube IP.
local:
  host: infisical.192.168.49.2.nip.io
  ingressClassName: nginx
  encryptionKey: a34953b4f3c2ff1d05aeb0b72345abae
  authSecret: 554DQHBb0ZTysAP0DihOwpPciRfJrRwyWwoA6VMlrrw=

infisical-standalone:
  infisical:
    replicaCount: 1
    extraEnv:
      - name: OTEL_TELEMETRY_COLLECTION_ENABLED
        value: "true"
      - name: OTEL_EXPORT_TYPE
        value: prometheus
      - name: OTEL_EXPORTER_PROMETHEUS_HOST
        value: "0.0.0.0"
      - name: OTEL_EXPORTER_PROMETHEUS_PORT
        value: "9464"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9464"
      prometheus.io/path: /metrics
    service:
      type: ClusterIP
    kubeSecretRef: infisical-secrets
  ingress:
    enabled: false
    nginx:
      enabled: false
