{{- if .Values.s3Ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-s3
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ printf "%s-ingress-auth" .Release.Name | quote }}
    nginx.ingress.kubernetes.io/auth-realm: SeaweedFS S3
    {{- if .Values.s3Ingress.allowedSourceRanges }}
    nginx.ingress.kubernetes.io/satisfy: "any"
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.s3Ingress.allowedSourceRanges | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: {{ .Values.s3Ingress.className | quote }}
  tls:
    - hosts:
        - {{ .Values.s3Ingress.host | quote }}
      {{- if .Values.s3Ingress.tlsSecretName }}
      secretName: {{ .Values.s3Ingress.tlsSecretName | quote }}
      {{- end }}
  rules:
    - host: {{ .Values.s3Ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "seaweedfs.componentName" (list (index .Subcharts "seaweedfs") "s3") }}
                port:
                  number: {{ .Values.seaweedfs.s3.port }}
{{- end }}
