{{- if .Values.pushAuth.enabled }}
{{- $auth := .Values.pushAuth }}
{{- if not $auth.spokes }}
{{- fail "pushAuth.spokes must contain at least one name/passwordKey pair" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-push-auth
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: push-auth
spec:
  refreshInterval: {{ $auth.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "pushAuth.clusterSecretStore must be set" $auth.clusterSecretStore }}
  target:
    name: loki-push-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # Legacy values are complete htpasswd entries; preserve them unchanged.
        auth: |
          {{- range $auth.spokes }}
          {{ printf "{{ index . %q }}" (required "each legacy spoke needs a name" .name) }}
          {{- end }}
  data:
    {{- range $auth.spokes }}
    - secretKey: {{ .name | quote }}
      remoteRef:
        key: {{ required "each legacy spoke needs a passwordKey" .passwordKey | quote }}
    {{- end }}
{{- end }}
