{{- if .Values.pushSecrets.enabled }}
{{- $push := .Values.pushSecrets }}
{{- range $push.sources }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: {{ $push.refreshInterval | quote }}
  updatePolicy: Replace
  # Keep the remote copies if this resource is removed from Git.
  deletionPolicy: None
  secretStoreRefs:
    - name: {{ $push.clusterSecretStore }}
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ .secretName }}
  data:
    {{- range .data }}
    - match:
        secretKey: {{ .secretKey | quote }}
        remoteRef:
          remoteKey: {{ .remoteKey | quote }}
    {{- end }}
{{- end }}
{{- end }}
