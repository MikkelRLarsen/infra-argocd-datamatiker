apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.seaweedfs.admin.secret.existingSecret }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{ .Values.seaweedfs.admin.secret.userKey }}: {{ .Values.adminCredentials.username | quote }}
  {{ .Values.seaweedfs.admin.secret.pwKey }}: {{ .Values.adminCredentials.password | quote }}
