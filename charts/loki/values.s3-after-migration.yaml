# Standalone reference snapshot after S3 migration: one SingleBinary replica.
# The 1Gi PVC holds WAL and local working state; durable log storage is S3.
loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
      s3:
        endpoint: seaweedfs-s3.seaweedfs.svc.cluster.local:8333
        region: us-east-1
        accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
        secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
        s3ForcePathStyle: true
        insecure: true

    # Consider removing ruler, since we don't have any Loki alerts
    rulerConfig:
      storage:
        type: local
        local:
          directory: /rules

    ingester:
      wal:
        enabled: true
        flush_on_shutdown: true

    schemaConfig:
      configs:
        - from: "2026-10-29"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    limits_config:
      retention_period: 48h

    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: s3

    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3100"
      prometheus.io/path: "/metrics"
      prometheus.io/container: "loki"

  singleBinary:
    replicas: 1
    extraArgs:
      - -config.expand-env=true
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials
    persistence:
      enabled: true
      size: 1Gi
    terminationGracePeriodSeconds: 300

  gateway:
    enabled: false

  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  test:
    enabled: false
  lokiCanary:
    enabled: false
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0


s3Credentials:
  enabled: true
  clusterSecretStore: infisical-loki-dev
  refreshInterval: 5m
  data:
    - secretKey: LOKI_S3_ACCESS_KEY_ID
      remoteKey: LOKI_S3_ACCESS_KEY_ID
    - secretKey: LOKI_S3_SECRET_ACCESS_KEY
      remoteKey: LOKI_S3_SECRET_ACCESS_KEY

pushIngress:
  enabled: true
  host: loki.192.168.49.2.nip.io
  ingressClassName: nginx
  tlsSecretName: ""
  sourceRange: ""

pushAuth:
  enabled: true
  clusterSecretStore: infisical-loki-dev
  refreshInterval: 5m
  spokes:
    - username: workload-dev
      passwordKey: workload_dev_rw_password
