{{- if .Values.externalSecretRead.enabled }}
{{- range $name, $auth := .Values.externalSecretRead.items }}
{{- if not $auth.secretName }}
{{- fail (printf "externalSecretRead.items.%s.secretName is required" $name) }}
{{- end }}
{{- if not $auth.clusterSecretStore }}
{{- fail (printf "externalSecretRead.items.%s.clusterSecretStore is required" $name) }}
{{- end }}
{{- if not $auth.username }}
{{- fail (printf "externalSecretRead.items.%s.username is required" $name) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $auth.secretName | quote }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ $.Values.externalSecretRead.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $auth.clusterSecretStore | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ $auth.secretName | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        username: {{ $auth.username | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $auth.username | quote }}
{{- end }}
{{- end }}
