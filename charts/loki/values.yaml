# The outer loki key configures the dependency; the inner loki key configures Loki itself.
loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 3
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
      s3:
        endpoint: seaweedfs-s3.seaweedfs.svc.cluster.local:8333
        region: us-east-1
        accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
        secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
        s3ForcePathStyle: true
        insecure: true

    rulerConfig:
      storage:
        type: local

    ingester:
      wal:
        enabled: true
        flush_on_shutdown: true

    storage_config:
      # Preserve the backend definition for the historical filesystem schema.
      filesystem:
        directory: /var/loki/chunks

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
        # Deploy before this date (00:00 UTC); move forward if setup is delayed.
        - from: "2026-10-29"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    limits_config:
      retention_period: 48h

    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: s3

    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3100"
      prometheus.io/path: "/metrics"
      prometheus.io/container: "loki"

  singleBinary:
    replicas: 3
    # Remove chart-default anti-affinity for single-node Minikube.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution: []
    extraArgs:
      - -config.expand-env=true
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials
    persistence:
      enabled: true
      size: 1Gi
    terminationGracePeriodSeconds: 300

  gateway:
    enabled: false

  chunksCache:
    enabled: true
    replicas: 1
    allocatedMemory: 256
    allocatedCPU: 100m
    writebackSizeLimit: 32MB
    writebackBuffer: 10000
  resultsCache:
    enabled: true
    replicas: 1
    allocatedMemory: 128
    allocatedCPU: 100m
    writebackSizeLimit: 32MB
    writebackBuffer: 10000

  test:
    enabled: false
  lokiCanary:
    enabled: false
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0


s3Credentials:
  enabled: true
  clusterSecretStore: infisical-loki-dev
  refreshInterval: 5m
  data:
    - secretKey: LOKI_S3_ACCESS_KEY_ID
      remoteKey: LOKI_S3_ACCESS_KEY_ID
    - secretKey: LOKI_S3_SECRET_ACCESS_KEY
      remoteKey: LOKI_S3_SECRET_ACCESS_KEY

pushIngress:
  enabled: true
  host: loki.192.168.49.2.nip.io
  ingressClassName: nginx
  tlsSecretName: ""
  sourceRange: ""

pushAuth:
  enabled: true
  clusterSecretStore: infisical-loki-dev
  refreshInterval: 5m
  spokes:
    - username: workload-dev
      passwordKey: workload_dev_rw_password
