{{- if .Values.datasourceAuth.enabled }}
{{- $auth := .Values.datasourceAuth }}
{{- if not $auth.spokes }}
{{- fail "datasourceAuth.spokes must contain at least one username/passwordKey pair" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-datasource-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: datasource-auth
spec:
  refreshInterval: {{ $auth.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "datasourceAuth.clusterSecretStore must be set" $auth.clusterSecretStore }}
  target:
    name: {{ .Release.Name }}-datasource-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        auth: |
          {{- range $auth.spokes }}
          {{ printf "{{ htpasswd %q (index . %q) \"bcrypt\" }}"
            (required "each spoke needs a username" .username)
            .username }}
          {{- end }}
  data:
    {{- range $auth.spokes }}
    - secretKey: {{ .username | quote }}
      remoteRef:
        key: {{ .username | quote }}
    {{- end }}
{{- end }}
