{{- range .Values.stores }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
spec:
  provider:
    infisical:
      hostAPI: {{ $.Values.infisical.hostAPI | quote }}
      auth:
        universalAuthCredentials:
          clientId:
            name: {{ $.Values.infisical.credentialsSecretName }}
            namespace: {{ $.Release.Namespace }}
            key: clientId
          clientSecret:
            name: {{ $.Values.infisical.credentialsSecretName }}
            namespace: {{ $.Release.Namespace }}
            key: clientSecret
      secretsScope:
        projectSlug: {{ .projectSlug | quote }}
        environmentSlug: {{ .envSlug | quote }}
        secretsPath: {{ .secretsPath | default "/" | quote }}
{{- end }}
