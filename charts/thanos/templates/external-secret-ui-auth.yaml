{{- if .Values.uiIngress.enabled }}
{{- $auth := .Values.uiAuth }}
{{- if not $auth.users }}
{{- fail "uiAuth.users must contain at least one username/passwordKey pair" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-ui-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: ui-auth
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "externalSecrets.clusterSecretStore must be set" .Values.externalSecrets.clusterSecretStore }}
  target:
    name: {{ .Release.Name }}-ui-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        auth: |
          {{- range $auth.users }}
          {{ printf "{{ htpasswd %q (index . %q) \"bcrypt\" }}"
            (required "each user needs a username" .username)
            (required "each user needs a passwordKey" .passwordKey) }}
          {{- end }}
  data:
    {{- range $auth.users }}
    - secretKey: {{ .passwordKey | quote }}
      remoteRef:
        key: {{ .passwordKey | quote }}
    {{- end }}
{{- end }}
