apiVersion: v1
kind: Secret
metadata:
  name: {{ (index .Values "infisical-standalone").infisical.kubeSecretRef }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ .Values.local.encryptionKey | quote }}
  AUTH_SECRET: {{ .Values.local.authSecret | quote }}
  SITE_URL: {{ printf "http://%s" .Values.local.host | quote }}
