apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.local.ingressClassName | quote }}
  rules:
    - host: {{ .Values.local.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "infisical.fullname" (index .Subcharts "infisical-standalone") }}
                port:
                  number: 8080
