{{- if .Values.s3Credentials.enabled }}
{{- $credentials := .Values.s3Credentials }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: s3-credentials
spec:
  refreshInterval: {{ $credentials.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "s3Credentials.clusterSecretStore must be set" $credentials.clusterSecretStore }}
  target:
    name: loki-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $credentials.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteKey | quote }}
    {{- end }}
{{- end }}
