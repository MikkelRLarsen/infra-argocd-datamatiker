{{- /*
Legacy remote-write basic auth. The username comes from values and passwordKey
references the plain password in Infisical. The ingress separately reads the
complete bcrypt htpasswd entry for this credential. Grant the ESO machine
identity read access to the referenced project and environment before syncing.
*/ -}}
{{- if .Values.legacyExternalSecret.enabled }}
{{- if not .Values.legacyExternalSecret.clusterSecretStore }}
{{- fail "legacyExternalSecret.enabled is true but legacyExternalSecret.clusterSecretStore is empty" }}
{{- end }}
{{- if not .Values.legacyExternalSecret.passwordKey }}
{{- fail "legacyExternalSecret.enabled is true but legacyExternalSecret.passwordKey is empty" }}
{{- end }}
{{- if not .Values.legacyExternalSecret.username }}
{{- fail "legacyExternalSecret.enabled is true but legacyExternalSecret.username is empty" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alloy-remote-write-auth
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: alloy-remote-write-auth
    app.kubernetes.io/component: remote-write-auth
spec:
  refreshInterval: {{ .Values.legacyExternalSecret.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.legacyExternalSecret.clusterSecretStore }}
  target:
    name: alloy-remote-write-auth
    creationPolicy: Owner
    template:
      data:
        # From values — Infisical has no username for this credential.
        username: {{ .Values.legacyExternalSecret.username | quote }}
        # From Infisical, fetched below.
        password: {{ printf "{{ .password }}" | quote }}
        # Unused, but required by k8s-monitoring's existing-Secret configuration.
        tenantId: ""
        ca: ""
        cert: ""
        key: ""
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.legacyExternalSecret.passwordKey }}
{{- end }}
