{{- if .Values.externalSecret.enabled }}
{{- $auth := .Values.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $auth.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ $auth.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $auth.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $auth.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        username: {{ $auth.username | quote }}
        # Unused, but the keys must exist for k8s-monitoring auth to work
        tenantId: ""
        ca: ""
        cert: ""
        key: ""
  data:
    - secretKey: password
      remoteRef:
        key: {{ $auth.passwordKey | quote }}
{{- end }}
