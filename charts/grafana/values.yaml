grafana:
  admin:
    existingSecret: grafana
    userKey: GRAFANA_ADMIN_USERNAME
    passwordKey: GRAFANA_ADMIN_PASSWORD

  envFromSecret: grafana

  envValueFrom:
    LOKI_DEV_USERNAME:
      secretKeyRef:
        name: grafana-loki-dev-read-auth
        key: username

    LOKI_DEV_PASSWORD:
      secretKeyRef:
        name: grafana-loki-dev-read-auth
        key: password

  grafana.ini:
    database:
      type: postgres
      host: $__env{POSTGRES_HOSTNAME}:$__env{POSTGRES_PORT}
      name: $__env{POSTGRES_DB}
      user: $__env{POSTGRES_USER}
      password: $__env{POSTGRES_PASSWORD}
      ssl_mode: disable

    annotations.alert:
      max_age: 90d

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          url: http://prometheus-server.prometheus
          access: proxy
          isDefault: true

        - name: Loki
          uid: loki
          type: loki
          url: http://loki.loki:3100
          access: proxy

        - name: Loki-ingress
          uid: loki-ingress
          type: loki
          url: https://loki.192.168.49.2.nip.io
          access: proxy

          basicAuth: true
          basicAuthUser: $LOKI_DEV_USERNAME

          secureJsonData:
            basicAuthPassword: $LOKI_DEV_PASSWORD

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# Values stay in Infisical; Git declares only the store, keys, and public settings.
externalSecrets:
  storeName: infisical-grafana-dev
  secretName: grafana
  refreshInterval: 1m
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteKey: POSTGRES_PASSWORD
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteKey: GRAFANA_ADMIN_PASSWORD
  templateData:
    POSTGRES_DB: grafana
    POSTGRES_USER: grafana
    POSTGRES_HOSTNAME: grafana-postgres
    POSTGRES_PORT: "5432"
    GRAFANA_ADMIN_USERNAME: admin

externalSecretRead:
  enabled: true
  refreshInterval: 5m
  items:
    loki-dev:
      secretName: grafana-loki-dev-read-auth
      clusterSecretStore: infisical-loki-dev-root
      username: grafana-dev

postgres:
  enabled: true
  image: postgres:17.10

  persistence:
    storageClass: ""
    size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
