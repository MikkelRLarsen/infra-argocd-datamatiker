externalSecrets:
  storeName: infisical-seaweedfs-dev
  refreshInterval: 1m
  data:
    - secretKey: admin-password
      remoteKey: ADMIN_PASSWORD
  templateData:
    admin-user: admin

seaweedfs:
  master:
    enabled: true
    replicas: 3
    affinity: ""
    metricsPort: 9327
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9327"
      prometheus.io/path: /metrics
    defaultReplication: "001"
    data:
      type: persistentVolumeClaim
      size: 1Gi
    logs:
      type: emptyDir

  volume:
    enabled: true
    replicas: 2
    affinity: ""
    metricsPort: 9327
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9327"
      prometheus.io/path: /metrics
    dataDirs:
      - name: data1
        type: persistentVolumeClaim
        size: 2Gi
        maxVolumes: 8

  filer:
    enabled: true
    replicas: 2
    affinity: ""
    metricsPort: 9327
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9327"
      prometheus.io/path: /metrics
    defaultReplicaPlacement: "001"
    data:
      type: persistentVolumeClaim
      size: 1Gi
    logs:
      type: emptyDir

  s3:
    enabled: true
    replicas: 2
    metricsPort: 9327
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9327"
      prometheus.io/path: /metrics
    logs:
      type: emptyDir

  admin:
    enabled: true
    replicas: 1
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "23646"
      prometheus.io/path: /metrics
    secret:
      existingSecret: seaweedfs-admin
      userKey: admin-user
      pwKey: admin-password
    data:
      type: persistentVolumeClaim
      size: 1Gi
  worker:
    enabled: true
    replicas: 1
    metricsPort: 9327
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9327"
      prometheus.io/path: /metrics
