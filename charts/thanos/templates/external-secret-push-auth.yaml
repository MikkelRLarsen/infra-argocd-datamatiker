{{- if .Values.pushIngress.enabled }}
{{- $auth := .Values.pushAuth }}
{{- if not $auth.spokes }}
{{- fail "pushAuth.spokes must contain at least one username/passwordKey pair" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-push-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: push-auth
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "externalSecrets.clusterSecretStore must be set" .Values.externalSecrets.clusterSecretStore }}
  target:
    name: {{ .Release.Name }}-push-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        auth: |
          {{- range $auth.spokes }}
          {{ printf "{{ htpasswd %q (index . %q) \"bcrypt\" }}"
            (required "each user needs a username" .username)
            (required "each user needs a passwordKey" .passwordKey) }}
          {{- end }}
  data:
    {{- range $auth.spokes }}
    - secretKey: {{ .passwordKey | quote }}
      remoteRef:
        key: {{ .passwordKey | quote }}
    {{- end }}
{{- end }}
