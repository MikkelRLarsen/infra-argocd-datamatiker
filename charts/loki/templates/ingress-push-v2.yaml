{{- if .Values.pushIngressV2.enabled }}
{{- $ing := .Values.pushIngressV2 }}
{{- if not $ing.host }}
{{- fail "pushIngressV2.host must be set" }}
{{- end }}
{{- if not .Values.pushAuthV2.enabled }}
{{- fail "pushIngressV2 requires pushAuthV2.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-push-v2
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: push-ingress-v2
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: loki-push-v2-auth
    nginx.ingress.kubernetes.io/auth-realm: loki push v2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- with $ing.rewriteTarget }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: {{ . | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    {{- with $ing.clientBodyBufferSize }}
    nginx.ingress.kubernetes.io/client-body-buffer-size: {{ . | quote }}
    {{- end }}
    {{- with $ing.sourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $ing.ingressClassName }}
  tls:
    - hosts:
        - {{ $ing.host | quote }}
      secretName: {{ $ing.tlsSecretName }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /v2/loki/api/v1/push
            pathType: ImplementationSpecific
            backend:
              service:
                name: loki
                port:
                  number: 3100
{{- end }}
